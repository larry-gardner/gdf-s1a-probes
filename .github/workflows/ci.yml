name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: gdf-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s toy -v
      - name: R3 secret visibility
        env:
          CANARY: ${{ secrets.GDF_CANARY }}
        run: |
          if [ -n "$CANARY" ]; then echo "r3_ci_secret=present"; exit 1; fi
          echo "r3_ci_secret=absent"
